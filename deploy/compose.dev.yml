name: formsoftware-dev
services:
  db:
    image: ${FORM_POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_DB: formsoftware_dev
      POSTGRES_USER: formsw
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm dev:setup first}
    ports:
      - "127.0.0.1:55437:5432"
    volumes:
      - dev-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formsw -d formsoftware_dev"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  dev-db:

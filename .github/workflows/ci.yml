name: Check
on: [push, pull_request]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:web
      - run: pnpm build
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: formsw
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: formsoftware_dev
        ports: ["55437:5432"]
        options: --health-cmd "pg_isready -U formsw" --health-interval 3s --health-retries 20
    env:
      DATABASE_URL: postgres://formsw:disposable-ci-password@127.0.0.1:55437/formsoftware_dev
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo check --locked
      - run: cargo test --locked -p form-domain
      - run: cargo test --locked -p form-server --test workflow
